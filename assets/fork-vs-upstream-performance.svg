<svg xmlns="http://www.w3.org/2000/svg" width="880" height="758" viewBox="0 0 880 758" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 68.4 s against 74.9 s, syncs one edited file in 8.90 s against 11.6 s, and answers a warm question in 131 ms against 242 ms. Of 76 comparisons it is better in 58, about the same in 8 and worse in 10.</desc>
<rect width="880" height="758" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">Index on n8n 1.1× faster, CPython 1.6× faster; the fork uses 44–50% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.1× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">74.9 s → 68.4 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 59.4 s → 65.2 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.3× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">11.6 s → 8.90 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 8.68 s → 8.02 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.8× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">242 ms → 131 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 211 ms → 107 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">50% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">12.39 GiB → 6.18 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 9.23 GiB → 6.61 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">19% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.40 GiB → 3.58 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.40 GiB → 1.37 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">2.1× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">73 ms → 35 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 36 ms → 21 ms</text><rect x="24" y="392" width="832" height="286" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing Alamofire: 1.35 s → 1.60 s on Node (+18%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing pretix: 9.04 s → 12.0 s on Node (+33%), 7.20 s → 11.8 s on Bun (+64%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing supabase: 16.4 s → 18.7 s on Bun (+14%)</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing n8n: 59.4 s → 65.2 s on Bun (+10%)</text><text x="40" y="534" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Syncing one file in pretix: 1.13 s → 1.27 s on Bun (+11%)</text><text x="40" y="556" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory busy on n8n (MCP server): 3.85 GiB → 4.54 GiB on Node (+18%)</text><text x="40" y="578" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">8 asks at once on gin (MCP server): 114 ms → 134 ms on Node (+18%), 153 ms → 161 ms on Bun (+5%)</text><text x="40" y="600" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">File watcher on gin (MCP server): 357 ms → 358 ms on Bun (0%)</text><text x="40" y="622" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">No clear change (inside the comparison's own run-to-run spread): indexing gin on Node; indexing gin on Bun; indexing</text><text x="40" y="644" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">supabase on Node; memory indexing supabase on Node; syncing one file in gin on Bun; syncing one file in supabase on</text><text x="40" y="666" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Node; memory busy on n8n (MCP server) on Bun; cPU idle on gin (MCP server) on Bun.</text><text x="24" y="704" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 76 comparisons on Node and Bun: better in 58, no clear change in 8, worse in 10. A difference counts only when</text><text x="24" y="722" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">it exceeds that comparison's own run-to-run spread.</text><text x="24" y="742" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-29 · upstream 69af19ac vs fork c29349a3 · Node 24.22.1, Bun 1.4.4 · 16-vCPU WSL2 · two runs per arm, median · fork on Node unless noted</text>
</svg>
