<svg xmlns="http://www.w3.org/2000/svg" width="880" height="696" viewBox="0 0 880 696" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 72.5 s against 85.9 s, syncs one edited file in 4.44 s against 13.2 s, and answers a warm question in 204 ms against 681 ms. Of 76 comparisons it is better in 60, about the same in 4 and worse in 12.</desc>
<rect width="880" height="696" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">n8n and CPython: the fork indexes 1.1–1.2× faster and uses 32–33% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.2× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">85.9 s → 72.5 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 81.6 s → 72.1 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.0× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">13.2 s → 4.44 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 10.8 s → 4.31 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.3× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">681 ms → 204 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 681 ms → 221 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">32% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">9.80 GiB → 6.69 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 6.97 GiB → 5.99 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">57% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.80 GiB → 2.06 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.62 GiB → 1.19 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.9× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">73 ms → 38 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 49 ms → 29 ms</text><rect x="24" y="392" width="832" height="242" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing gin: 0.83 s → 0.95 s on Bun (+13%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing Alamofire: 1.45 s → 1.69 s on Node (+17%), 1.37 s → 1.67 s on Bun (+22%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing pretix: 8.29 s → 9.66 s on Node (+17%), 7.83 s → 9.46 s on Bun (+21%)</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing supabase: 18.1 s → 20.5 s on Node (+13%), 18.2 s → 21.1 s on Bun (+16%)</text><text x="40" y="534" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing pretix: 2.97 GiB → 3.37 GiB on Node (+14%), 2.40 GiB → 2.55 GiB on Bun (+6%)</text><text x="40" y="556" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Syncing one file in CPython: 6.83 s → 7.34 s on Node (+7%), 6.16 s → 7.80 s on Bun (+27%)</text><text x="40" y="578" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Warm ask on gin (MCP server): 23 ms → 25 ms on Bun (+7%)</text><text x="40" y="600" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">About the same (within 3%): indexing gin on Node; indexing discourse on Node; syncing one file in pretix on Bun; file</text><text x="40" y="622" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">watcher on gin (MCP server) on Bun.</text><text x="24" y="660" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 76 comparisons on Node and Bun: better in 60, about the same in 4, worse in 12.</text><text x="24" y="680" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-13 · upstream 34dd3d2f vs fork f045e5f7 · Node 24.21.0, Bun 1.4.3 · 16-vCPU WSL2 · two runs per arm, median · fork on Node unless noted</text>
</svg>
