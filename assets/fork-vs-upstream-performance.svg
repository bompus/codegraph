<svg xmlns="http://www.w3.org/2000/svg" width="880" height="758" viewBox="0 0 880 758" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 49.4 s against 83.0 s, syncs one edited file in 3.29 s against 11.6 s, and answers a warm question in 131 ms against 242 ms. Of 76 comparisons it is better in 57, about the same in 6 and worse in 13.</desc>
<rect width="880" height="758" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">Index on n8n 1.7× faster, CPython 2.1× faster; the fork uses 9–30% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.7× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">83.0 s → 49.4 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 60.5 s → 46.6 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.5× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">11.6 s → 3.29 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 9.17 s → 2.45 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.8× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">242 ms → 131 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 211 ms → 107 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">30% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">11.00 GiB → 7.65 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 9.54 GiB → 8.43 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">19% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.40 GiB → 3.58 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.40 GiB → 1.37 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">2.1× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">73 ms → 35 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 36 ms → 21 ms</text><rect x="24" y="392" width="832" height="286" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing gin: 0.96 s → 1.02 s on Node (+6%), 0.77 s → 0.91 s on Bun (+18%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing Alamofire: 817 MiB → 1.05 GiB on Node (+32%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing pretix: 2.92 GiB → 3.97 GiB on Node (+36%), 2.88 GiB → 3.85 GiB on Bun (+34%)</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing supabase: 4.23 GiB → 4.83 GiB on Node (+14%), 4.10 GiB → 4.63 GiB on Bun (+13%)</text><text x="40" y="534" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Syncing one file in discourse: 1.19 s → 1.75 s on Node (+47%), 0.92 s → 1.20 s on Bun (+31%)</text><text x="40" y="556" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory busy on n8n (MCP server): 3.85 GiB → 4.54 GiB on Node (+18%)</text><text x="40" y="578" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">8 asks at once on gin (MCP server): 114 ms → 134 ms on Node (+18%), 153 ms → 161 ms on Bun (+5%)</text><text x="40" y="600" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">File watcher on gin (MCP server): 357 ms → 358 ms on Bun (0%)</text><text x="40" y="622" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">No clear change (inside the comparison's own run-to-run spread): indexing pretix on Bun; memory indexing CPython on</text><text x="40" y="644" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Node; memory indexing discourse on Node; syncing one file in gin on Bun; memory busy on n8n (MCP server) on Bun; cPU</text><text x="40" y="666" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">idle on gin (MCP server) on Bun.</text><text x="24" y="704" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 76 comparisons on Node and Bun: better in 57, no clear change in 6, worse in 13. A difference counts only when</text><text x="24" y="722" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">it exceeds that comparison's own run-to-run spread.</text><text x="24" y="742" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-28 · upstream 69af19ac vs fork de5a7b80 · Node 24.22.1, Bun 1.4.4 · 24-core Linux, 122 GiB · two runs per arm, median · fork on Node unless noted</text>
</svg>
