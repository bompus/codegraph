<svg xmlns="http://www.w3.org/2000/svg" width="880" height="586" viewBox="0 0 880 586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 71.8 s against 163.6 s, syncs one edited file in 4.39 s against 12.8 s, and answers a warm question in 214 ms against 693 ms. Of 76 comparisons it is better in 68, about the same in 5 and worse in 3.</desc>
<rect width="880" height="586" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">n8n and CPython: the fork indexes 2.3× faster and uses 34–53% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">2.3× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">163.6 s → 71.8 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 157.8 s → 72.9 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">2.9× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">12.8 s → 4.39 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 10.6 s → 4.12 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.2× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">693 ms → 214 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 685 ms → 211 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">34% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">9.66 GiB → 6.38 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 7.28 GiB → 6.10 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">56% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.77 GiB → 2.09 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.07 GiB → 1.21 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.7× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">68 ms → 39 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 46 ms → 30 ms</text><rect x="24" y="392" width="832" height="132" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing Alamofire: 1.73 s → 1.81 s on Node (+5%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Warm ask on gin (MCP server): 24 ms → 26 ms on Node (+8%), 24 ms → 25 ms on Bun (+4%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">About the same (within 3%): indexing gin on Node; memory indexing pretix on Bun; memory indexing supabase on Bun;</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">syncing one file in gin on Bun; file watcher on gin (MCP server) on Bun.</text><text x="24" y="550" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 76 comparisons on Node and Bun: better in 68, about the same in 5, worse in 3.</text><text x="24" y="570" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-12 · upstream 6560052 vs fork ce6120be · Node 24.21.0, Bun 1.4.3 · 16-vCPU WSL2 · two runs per arm, median · fork on Node unless noted</text>
</svg>
