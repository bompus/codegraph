<svg xmlns="http://www.w3.org/2000/svg" width="880" height="626" viewBox="0 0 880 626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 66.3 s against 84.5 s, syncs one edited file in 4.37 s against 13.1 s, and answers a warm question in 177 ms against 600 ms. Of 74 comparisons it is better in 65, about the same in 4 and worse in 5.</desc>
<rect width="880" height="626" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">n8n and CPython: the fork indexes 1.2–1.3× faster and uses 35–37% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.3× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">84.5 s → 66.3 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 74.7 s → 66.0 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.0× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">13.1 s → 4.37 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 10.7 s → 3.79 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.4× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">600 ms → 177 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 639 ms → 187 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">37% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">9.97 GiB → 6.30 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 7.49 GiB → 6.07 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">56% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.88 GiB → 2.15 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.24 GiB → 1.23 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.9× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">64 ms → 33 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 41 ms → 24 ms</text><rect x="24" y="392" width="832" height="154" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing pretix: 8.36 s → 9.40 s on Node (+13%), 7.75 s → 9.27 s on Bun (+20%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing Alamofire: 830 MiB → 953 MiB on Node (+15%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing pretix: 2.94 GiB → 3.25 GiB on Node (+11%), 2.36 GiB → 2.50 GiB on Bun (+6%)</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">About the same (within 3%): indexing gin on Bun; indexing discourse on Node; indexing supabase on Node; indexing</text><text x="40" y="534" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">supabase on Bun.</text><text x="24" y="572" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 74 comparisons on Node and Bun: better in 65, about the same in 4, worse in 5. 2 more are left out because the</text><text x="24" y="590" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">one-file sync failed for upstream on Node and upstream on Bun.</text><text x="24" y="610" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-18 · upstream 986de95c vs fork 633fc82c · Node 24.22.0, Bun 1.4.3 · 16-vCPU WSL2 · two runs per arm, median · fork on Node unless noted</text>
</svg>
