<svg xmlns="http://www.w3.org/2000/svg" width="880" height="630" viewBox="0 0 880 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fork vs upstream CodeGraph: headline numbers</title>
<desc id="d">On n8n the fork indexes in 71.2 s against 88.3 s, syncs one edited file in 4.72 s against 14.0 s, and answers a warm question in 203 ms against 700 ms. Of 74 comparisons it is better in 61, about the same in 6 and worse in 7.</desc>
<rect width="880" height="630" rx="8" fill="#0d1117"/>
<text x="24" y="38" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">n8n and CPython: the fork indexes 1.1–1.2× faster and uses 33–36% less memory</text><text x="24" y="60" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Numbers are for n8n (the largest test repo) and the command line. Lower is better. Upstream → fork.</text><rect x="24" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Index n8n from scratch</text><text x="40" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">1.2× faster</text><text x="40" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">88.3 s → 71.2 s</text><text x="40" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 80.9 s → 73.5 s</text><rect x="308" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Update after editing one file</text><text x="324" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.0× faster</text><text x="324" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">14.0 s → 4.72 s</text><text x="324" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 11.4 s → 4.10 s</text><rect x="592" y="82" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="108" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Answer a question (warm)</text><text x="608" y="154" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">3.5× faster</text><text x="608" y="182" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">700 ms → 203 ms</text><text x="608" y="202" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 717 ms → 223 ms</text><rect x="24" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="40" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Memory while indexing n8n</text><text x="40" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">33% less</text><text x="40" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">9.81 GiB → 6.53 GiB</text><text x="40" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 7.20 GiB → 6.21 GiB</text><rect x="308" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="324" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">MCP server memory when idle</text><text x="324" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">57% less</text><text x="324" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">4.91 GiB → 2.12 GiB</text><text x="324" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 3.20 GiB → 1.14 GiB</text><rect x="592" y="232" width="272" height="138" rx="8" fill="#161b22"/><text x="608" y="258" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Start the command line</text><text x="608" y="304" font-size="30" font-weight="700" fill="#2ea043" text-anchor="start">2.0× faster</text><text x="608" y="332" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">70 ms → 35 ms</text><text x="608" y="352" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">on Bun: 44 ms → 26 ms</text><rect x="24" y="392" width="832" height="176" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity=".5"/><text x="40" y="418" font-size="14" font-weight="700" fill="#f85149" text-anchor="start">Where the fork is not better</text><text x="40" y="446" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing Alamofire: 1.70 s → 1.90 s on Node (+12%), 1.63 s → 1.81 s on Bun (+11%)</text><text x="40" y="468" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing pretix: 9.85 s → 11.3 s on Node (+15%), 9.26 s → 10.7 s on Bun (+15%)</text><text x="40" y="490" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Indexing supabase: 20.3 s → 21.3 s on Bun (+5%)</text><text x="40" y="512" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Memory indexing pretix: 2.95 GiB → 3.35 GiB on Node (+14%), 2.36 GiB → 2.63 GiB on Bun (+11%)</text><text x="40" y="534" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">About the same (within 3%): indexing gin on Node; indexing gin on Bun; indexing discourse on Node; indexing supabase</text><text x="40" y="556" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">on Node; memory indexing supabase on Bun; file watcher on gin (MCP server) on Bun.</text><text x="24" y="594" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Over all 74 comparisons on Node and Bun: better in 61, about the same in 6, worse in 7. 2 more are left out because upstream's one-file sync failed.</text><text x="24" y="614" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">Measured 2026-10-14 · upstream 3f714bcc vs fork ba972275 · Node 24.22.0, Bun 1.4.3 · 16-vCPU WSL2 · two runs per arm, median · fork on Node unless noted</text>
</svg>
