name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'bompus/codegraph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fork/consolidated
          fetch-depth: 0

      - name: Mirror upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add canonical https://github.com/colbymchenry/codegraph.git
          git fetch origin main:refs/remotes/origin/main
          git fetch canonical main:refs/remotes/canonical/main
          expected=$(git rev-parse refs/remotes/origin/main)
          git push "--force-with-lease=refs/heads/main:${expected}" \
            origin refs/remotes/canonical/main:refs/heads/main
