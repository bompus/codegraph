name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'bompus/codegraph'
    runs-on: ubuntu-latest
    steps:
      # This repository allows only local actions, so the checkout is plain git
      # (as the other workflows do); `actions/checkout` would fail at startup.
      - name: Mirror upstream main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git remote add canonical https://github.com/colbymchenry/codegraph.git
          git -c "http.extraheader=$auth" fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags canonical main:refs/remotes/canonical/main
          expected=$(git rev-parse refs/remotes/origin/main)
          git -c "http.extraheader=$auth" push "--force-with-lease=refs/heads/main:${expected}" \
            origin refs/remotes/canonical/main:refs/heads/main
