name: Contained source reads
on:
  pull_request:
    branches: [fork/consolidated]
    paths:
      - 'codegraph-kernel/src/contained_source.rs'
      - 'codegraph-kernel/src/lib.rs'
      - 'src/extraction/kernel/loader.ts'
      - 'src/mcp/source-scan.ts'
      - '__tests__/source-scan.test.ts'
      - '__tests__/security.test.ts'
      - '__tests__/explore-unmatched-names.test.ts'
      - '.github/workflows/contained-source.yml'
permissions:
  contents: read
jobs:
  source-reads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:kernel
      - run: cargo test --manifest-path codegraph-kernel/Cargo.toml --release contained_source::tests -- --test-threads=1
      - run: npx vitest run __tests__/source-scan.test.ts __tests__/security.test.ts __tests__/explore-unmatched-names.test.ts -t "scanIndexedSource|native source reader|unmatched names" --maxWorkers=2 --minWorkers=1
