name: Kernel source stamps
on:
  pull_request:
    branches: [fork/consolidated]
    paths:
      - 'scripts/kernel-stamp.mjs'
      - 'scripts/ensure-kernel.mjs'
      - '__tests__/ensure-kernel-stamp.test.ts'
      - '.github/workflows/kernel-stamp.yml'
permissions:
  contents: read
jobs:
  stamps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Use the runner's Node 24 installation
        shell: pwsh
        run: |
          $versions = Get-ChildItem "$env:RUNNER_TOOL_CACHE/node" -Directory
          $version = $versions | Where-Object Name -like '24.*' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$version) { throw 'Node 24 is missing from the runner tool cache' }
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $nodeDir = Join-Path $version.FullName $arch
          if (!$IsWindows) { $nodeDir = Join-Path $nodeDir 'bin' }
          $nodeExe = if ($IsWindows) { 'node.exe' } else { 'node' }
          if (!(Test-Path (Join-Path $nodeDir $nodeExe))) { throw 'Node 24 executable is missing' }
          Add-Content $env:GITHUB_PATH $nodeDir
      - run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - run: npm ci --ignore-scripts
      - name: Run source stamp fixtures without a native kernel build
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const config = { test: {
            include: ['__tests__/ensure-kernel-stamp.test.ts'],
            setupFiles: ['__tests__/file-tmpdir.setup.ts', '__tests__/setup-home-sandbox.ts'],
            environment: 'node', maxWorkers: 1, minWorkers: 1,
          }};
          writeFileSync('.kernel-stamp-config.mjs', `export default ${JSON.stringify(config)};`);
          writeFileSync('.kernel-stamp-workspace.mjs', `export default [${JSON.stringify(config)}];`);
          JS
          npx vitest run --config .kernel-stamp-config.mjs --workspace .kernel-stamp-workspace.mjs
