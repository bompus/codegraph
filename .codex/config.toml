[mcp_servers.codegraph]
command = '/home/bompus/.bun/bin/bun'
args = [
  '/home/bompus/.local/share/bompus-espn-draft/codegraph-daily/dist/bin/codegraph.js',
  'serve',
  '--mcp',
]

# Bun uses JavaScriptCore; CodeGraph's V8 version guard and relaunch do not apply.
[mcp_servers.codegraph.env]
CODEGRAPH_ALLOW_UNSAFE_NODE = '1'
CODEGRAPH_NO_RELAUNCH = '1'
