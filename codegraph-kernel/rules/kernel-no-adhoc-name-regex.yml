id: kernel-no-adhoc-name-regex
language: Rust
severity: error
message: >-
  Regex::new(&format!(...)) compiles a name-parameterized regex on every
  call. Split the pattern into an Affix (the name found as a literal, the
  fixed head and tail compiled once, see resolve.rs) — or, for a shape with
  no split form, route it through KernelResolver::cached_regex, the bounded
  process-wide cache.
files:
  - src/resolve/**/*.rs
rule:
  kind: call_expression
  regex: 'Regex::new\s*\(\s*&?\s*format!'
