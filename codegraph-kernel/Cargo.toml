[package]
name = "codegraph-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Native extraction kernel for CodeGraph — tree-sitter parse+extract with one JS boundary crossing per file"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["addon"]
addon = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
addon-tests = ["addon", "napi/dyn-symbols"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3", optional = true }
tree-sitter = "0.25"
sha2 = "0.10"
memchr = "2"
regex = "1"
# The `\w` table `regex` itself uses, for word-boundary checks done by hand.
regex-syntax = "0.8"
# Bundled libsqlite3: the resolver's read stage must see the exact WAL
# semantics the writer (node:sqlite) produces, not whatever system
# libsqlite3 happens to be installed (resolve.rs, Phase 4).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# Grammars — MUST stay revision-matched with the wasm grammars the fallback
# path loads (tree-sitter-wasms npm package / src/extraction/wasm/). The
# kernel-grammar-parity test asserts node-kind-table equality at test time;
# bump these together with the wasm side or that gate fails.
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
# Pinned exact: the vendored wasm (src/extraction/wasm/) was built from these
# tags' checked-in parser.c, sha-matched against these registry tarballs
# (R7a prep, #1345). A patch bump here without re-vendoring breaks the match.
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"
# csharp: the vendored wasm (#717) predates the kernel and was verified
# table-identical to this crate's tarball (ABI 15, STATE_COUNT 8053, node-kind
# and field tables — csharp checklist header). Bump crate + wasm together.
tree-sitter-c-sharp = "=0.23.5"
# ruby: content bump, ABI stays 14 (the v0.23.1 tag predates the ABI-15
# generator) — kernel-grammar-parity asserts same-revision, not same-ABI.
tree-sitter-ruby = "=0.23.1"
# php: the walker calls LANGUAGE_PHP (the full HTML-interleaving variant the
# wasm ships) — NEVER LANGUAGE_PHP_ONLY, which errors on leading HTML.
tree-sitter-php = "=0.24.2"
# swift: NOT a crate dep — the kernel compiles tree-sitter-swift 0.7.3's
# tarball src/ itself (grammars/swift, build.rs), with a one-line scanner fix
# the crate's own build lacks on Windows (`try!`; docs/grammars/
# tree-sitter-swift.md). The vendored wasm is built from the same tarball.
# r: the vendored wasm IS r-lib v1.2.0 and this crate's tarball ships both
# generated artifacts sha-identical to the tag (parser.c 6221657347…,
# scanner.c 1209d11076… — r checklist §Grammar prep). ABI 14 (the tag
# predates the ABI-15 generator) — parity asserts same-revision, not
# same-ABI (ruby precedent). Bump crate + wasm together.
tree-sitter-r = "=1.2.0"
# luau: the vendored wasm IS tree-sitter-grammars v1.2.0 and this crate's
# tarball ships parser.c/scanner.c sha-identical to the tag (8f25bc17… /
# a157bb52… — lua-luau checklist §Grammar prep). ABI 14. Lua itself is
# vendored C (build.rs) — its v0.4.1 revision is not on crates.io.
tree-sitter-luau = "=1.2.0"

# tree-sitter-language: the version-agnostic LanguageFn shim for the vendored
# grammar C (kotlin, lua, scala, dart, swift — see build.rs).
# Phase 4 (kernel-only-extraction-plan.md): tail languages with NO bespoke
# walker. The kernel only PARSES them (parse_tree); the generic TS extractor
# walks the serialized tree. Versions are the crates.io releases closest to
# the vendored wasm grammars; kind-table drift is recorded in the plan.
tree-sitter-erlang = "0.20"
tree-sitter-nix = "0.3"
tree-sitter-pascal = "0.10"
tree-sitter-language = "0.1"

# Stack-bounds queries for the walker stack guard (src/stack.rs, #1581):
# pthread_getattr_np / pthread_get_stackaddr_np. Already in the lock file
# transitively; Windows uses a hand-declared kernel32 extern instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = { version = "2", optional = true }
cc = "1"

# Addon unit tests outside Node use --features addon-tests for dynamic symbols.

[profile.release]
# Never `panic = "abort"`: lib.rs walk_file turns a walker panic into a
# per-file error the TS side recovers from; abort would kill the indexer.
lto = true
codegen-units = 1
strip = "symbols"

# `npm run build:kernel:quick`: the same code without cross-crate optimization,
# for edit-and-test loops (about 4 s after a one-line resolver edit vs 90 s
# for release on a 16-vCPU machine). Never measure performance with it.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
