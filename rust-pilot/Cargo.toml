[package]
name = "codegraph-rust-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
fancy-regex = "0.18"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
ryu-js = "1"

[profile.dev]
debug = 0
