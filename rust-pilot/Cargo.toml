[package]
name = "codegraph-rust-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.18"
rusqlite = { version = "0.37", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
icu_collator = "2"
icu_locale = "2"

[profile.dev]
debug = 0
